name: Bug 报告
description: 工作台打不开、数据错乱、导入/导出失败、检查结果不对等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把「环境 + 复现步骤 + 日志」写清楚，能省掉很多来回。
        涉及数据的 bug，**不要上传真实作品全文**；用 `STORY_DESK_ROOT=/tmp/...` 新建一个小作品复现即可。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有重复
          required: true
        - label: 我已经试过重启 / 重载插件（Host 改动需 `set_bundle` 重载，客户端改动需刷新页面）
          required: false

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 在 DSH「设置 → 关于」里可以看到
      placeholder: 例如 1.x.x
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 用 `npm view dsh-long-novel-workbench version` 或看 `package.json`
      placeholder: 例如 0.4.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      description: 执行 `node --version`（本项目要求 Node 22+）
      placeholder: 例如 v22.22.1
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？在哪个页面 / 哪个操作后出现的？
      placeholder: 例如：在「人物」页切到「关系图」后整个工作台白屏。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开作品《…》
        2. 进入「…」页
        3. 点击「…」
        4. 看到 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你原本以为会发生什么？
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 报错信息 / 日志
      description: 浏览器控制台报错、DSH 终端输出、HTTP 接口返回等
      render: shell
    validations:
      required: false

  - type: textarea
    id: data-context
    attributes:
      label: 数据情况（可选）
      description: 作品大约多少章、是否由 Markdown 导入、是否用了多预设 / 多卷、是否修改过 `~/StoryDesk` 文件
    validations:
      required: false
