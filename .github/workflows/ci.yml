name: CI

on:
  push:
    branches: [main]
  pull_request:

# 0.7.1 起 `test/` 仍是 0.6 行为断言，项目规则是不跑自动化测试；
# CI 改为发布前预检：ESM 语法 + 版本/发布文档一致性。不跑 npm test。
jobs:
  check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 package.json 的 engines 保持一致：^22.19.0 || >=24.0.0
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # host 半边是 ESM 入口；lib/*.js 是宿主模块。逐个做语法检查（不执行）。
      - name: Syntax check host + lib
        run: |
          for f in index.js lib/*.js; do
            echo "check $f"
            node --check "$f"
          done

      # client.js 是浏览器模块，只做语法检查。
      - name: Syntax check client.js
        run: node --check client.js

      # 版本号、CHANGELOG、发布说明必须一致，避免发布文档缺失。
      - name: Version & release docs consistency
        run: |
          PKG_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          echo "version=$PKG_VERSION"
          grep -q "## \[${PKG_VERSION}\]" CHANGELOG.md
          test -f "docs/releases/v${PKG_VERSION}.md"
